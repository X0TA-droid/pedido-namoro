
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iai aceita? 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #87CEEB;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      width: 100%;
    }

    h1 {
      color: #590d22;
      font-size: clamp(25px, 6vw, 36px);
      margin-bottom: 35px;
    }

    .botoes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
    }

    button {
      background: #ffb3c1;
      color: #590d22;
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #nao {
      position: relative;
    }

    #sim {
      position: relative;
    }

    .coracao {
      font-size: 42px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="coracao">💙</div>

    <h1>Quer namorar comigo?</h1>

    <div class="botoes">
      <button id="sim">Sim 💗</button>
      <button id="nao">Não 😢</button>
    </div>
  </main>

  <script>
    const botaoSim = document.getElementById("sim");
    const botaoNao = document.getElementById("nao");

    function fugir() {
      const largura = window.innerWidth;
      const altura = window.innerHeight;

      botaoNao.style.position = "fixed";

      const maxX = Math.max(0, largura - botaoNao.offsetWidth - 20);
      const maxY = Math.max(0, altura - botaoNao.offsetHeight - 20);

      const x = 10 + Math.random() * Math.max(0, maxX - 10);
      const y = 10 + Math.random() * Math.max(0, maxY - 10);

      botaoNao.style.left = x + "px";
      botaoNao.style.top = y + "px";
    }

    botaoNao.addEventListener("pointerenter", fugir);

    botaoNao.addEventListener("touchstart", (evento) => {
      evento.preventDefault();
      fugir();
    });

    botaoSim.addEventListener("click", () => {
      alert("Eu te amo, meu amor! 💗🥰 Lanchinho mais tarde?");
    });
  </script>
</body>
</html>
